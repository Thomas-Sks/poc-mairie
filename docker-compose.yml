services:
  db:
    image: postgres:16-alpine
    container_name: poc-mairie-db
    environment:
      POSTGRES_USER: mairie
      POSTGRES_PASSWORD: mairie
      POSTGRES_DB: mairie
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mairie"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
